<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Margin, Padding & Box Model</title>
    <style>
        body {

            background-color: black;
            color: white;
        }

        .box {
            height: 100px;
            width: 100px;
            background-color: yellow;
            /* Padding means how much space it will cover */
            padding: 10px;
        }

        .box_2 {
            background-color: blue;
            height: 100px;
            width: 100px;
            /* margin: 20px 200px 0px 0px; */

            /* To center any element, first we give width then we give it margin auto */
            padding: 10px;
            margin: auto;
            border: 2px solid yelow;
        }
    </style>
</head>

<body>
    <h1>Padding, Margin and Box Model</h1>

    <!-- Padding -->
    <div class="box">

    </div>

    <!-- Margin -->
    <div class="box_2">
        Hello
    </div>

    <!-- Box Model : cpbm : content, padding, border, margin -->

    <!-- Box Sizing : border-box:intuitive-->
    <!-- By default, when you set `width: 200px` on an element, that 200px is **only the content**. Padding and border get
    added on top, making the actual element larger than you specified.

    ```css
    div {
    width: 200px;
    padding: 20px;
    border: 5px solid black;
    }
    /* actual rendered width = 200 + 20+20 + 5+5 = 250px */
    ```

    This is `box-sizing: content-box` — the default. Unintuitive.

    ---

    `box-sizing: border-box` changes this so the width you set **includes** padding and border:

    ```css
    div {
    box-sizing: border-box;
    width: 200px;
    padding: 20px;
    border: 5px solid black;
    }
    /* actual rendered width = exactly 200px, content shrinks to fit */
    ```

    ---

    **Why it matters:** When you're building layouts and you set two divs to `width: 50%` side by side, adding any
    padding breaks it without `border-box`. With it, everything stays predictable.

    Almost every project does this globally:

    ```css
    * {
    box-sizing: border-box;
    }
    ```

    Just put this at the top of your CSS and forget about it. -->
</body>

</html>
