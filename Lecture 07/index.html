<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline vs Block Elements + Div, Span</title>
</head>
<body>
    <h1 style="background-color: aliceblue;">This is Block Level Element</h1>
    <span style="background-color: aqua;">This is Inline Element</span>
    <!-- Block Elements are those which take the full width from the start to the end of the body of the Document, whereas Inline Elements only take the width which is necessary for them. -->
    <span style="background-color: pink;">This is another inline element.</span>
    <!-- Inline elements gets stacked up one after the other -->
    <p>This is also a block element</p>

    <h1 style="background-color: brown; color: white;">Web <span style="background-color: yellow; color: black;">DeV</span> Mastery</h1>


    <div>
        <!-- Division is a block level element -->
        <!-- Headings are block level element -->
        <!-- Img is inline, p is block, anchor is inline,  -->
    </div>
</body>
</html>
