<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heading, Para, Link, a</title>
</head>
<body>

    <!-- This is Heading Tag -->
    <h1>This is my Heading</h1>
    <h2>This is my 2nd Heading</h2>
    <h3>This is my 3rd Heading</h3>

    <!-- This is Paragraph Tag -->
    <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Porro, debitis?</p>

    <!-- This is anchor tag -->
    <a href="https://www.google.com/" target="_blank">This is Google.com</a>
    <br><!-- <br> is a self-closing tag, break-row tag -->
    <hr> <!-- This is a horizontal row tag, again a self-closing tag.-->
    <a href="https://www.google.com/" target="_blank">This is Google.com</a>
</body>
</html>
