<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio, Video, IFrames</title>
</head>
<body>
    <h1>HTML Media - Audio, Video and Embeds</h1>
    <!-- Audio Tag -->
    <!-- attributes : autoplay, muted, loop, controls -->
    <audio controls src="./fassounds-escape-your-love-upbeat-fashion-pop-dance-412230.mp3">Play, this Music</audio>

    <br>

    <!-- Video Tag -->
    <!-- poster tag is for the image youwant as the poster of your video, likea thumbnail -->
    <video src="./354006_medium.mp4" poster="" width="500" height="300" controls></video>

    <!-- IFrames is like a website inside the wbsite (youtube videos embed, google maps), used to play videos of the youtube , etc -->
    <!-- "https://www.youtube.com/watch?v=vZcy9ukvrfM" -->
     <!-- For, allowing the video to play in full screen, we use the property "allowfullscreen" -->
    <iframe  src="https://www.youtube.com/embed/vZcy9ukvrfM" allowfullscreen frameborder="0"></iframe>

</body>
</html>
