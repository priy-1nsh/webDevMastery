<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entities, Code and New HTML5 Tags</title>
</head>
<body>
    <h1>
        Copyright, etc Symbols are known as Entities
    </h1>
    <div class="footer">&copy; 1999-2005</div>

    <h1>&lt; Angular &gt;</h1>
    
    <code>
        Monospace font for the Code tag
    </code>

    <pre>
               This pre tag also keeps the space in between the tags.
    </pre>

    <!-- mark tag is used to highlight -->
    <p>Lorem ipsum dolor, sit amet consectetur <mark>adipisicing</mark> elit. Tempore, itaque?
    </p>

    <!-- marquee tag is used for the moving tag -->
    <marquee behavior="" direction="" style="background-color: yellow;">Hello</marquee>
</body>
</html>
